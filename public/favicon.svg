<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield/Badge Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  
  <!-- Outer Gold Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Stylized Green Ticket Icon -->
  <g transform="translate(116, 126) rotate(-10 140 130)" filter="url(#shadow)">
    <!-- Ticket Body -->
    <rect x="10" y="20" width="260" height="150" rx="18" fill="url(#ticketGrad)" stroke="#065f46" stroke-width="6"/>
    
    <!-- Ticket Left Notch -->
    <circle cx="10" cy="95" r="16" fill="url(#bgGrad)"/>
    <!-- Ticket Right Notch -->
    <circle cx="270" cy="95" r="16" fill="url(#bgGrad)"/>
    
    <!-- Inner Dashed Line -->
    <line x1="85" y1="30" x2="85" y2="160" stroke="#047857" stroke-width="4" stroke-dasharray="6 6"/>
    
    <!-- Star Emblem on Ticket -->
    <path d="M 175,60 L 183,78 L 202,80 L 188,94 L 192,113 L 175,103 L 158,113 L 162,94 L 148,80 L 167,78 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2"/>
    
    <!-- Text / Stripes on Left Stub -->
    <rect x="35" y="50" width="30" height="8" rx="4" fill="#065f46" opacity="0.7"/>
    <rect x="35" y="70" width="30" height="8" rx="4" fill="#065f46" opacity="0.7"/>
    <rect x="35" y="90" width="30" height="8" rx="4" fill="#065f46" opacity="0.7"/>
    <rect x="35" y="110" width="30" height="8" rx="4" fill="#065f46" opacity="0.7"/>
  </g>

  <!-- Rolling Ridge Roadrunner Crest Silhouette / Wings -->
  <g transform="translate(230, 190)" filter="url(#shadow)">
    <!-- Roadrunner Beak & Head Silhouette -->
    <path d="M 40,20 C 70,0 120,5 150,30 C 130,35 110,40 100,50 C 130,45 160,50 180,65 C 150,75 110,80 80,75 C 60,110 30,130 -20,150 C 10,120 20,90 25,60 C 10,50 0,35 40,20 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3"/>
  </g>

  <!-- School Title Banner Text -->
  <path id="textArc" d="M 80,256 A 176,176 0 0,1 432,256" fill="none"/>
  <text font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="3" text-anchor="middle">
    <textPath href="#textArc" startOffset="50%">ROLLING RIDGE</textPath>
  </text>
  
  <text x="256" y="430" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#fef08a" letter-spacing="4" text-anchor="middle" filter="url(#shadow)">
    RRD TICKETS
  </text>
</svg>
